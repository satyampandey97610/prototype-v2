<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MicroHeal Care Concierge</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 24px auto;
      max-width: 960px;
      background: #f8fafc;
      color: #0f172a;
      padding: 0 16px;
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      align-items: center;
    }
    select, input, button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
    }
    button {
      background: #0f172a;
      color: #ffffff;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #1e293b; }
    button.secondary {
      background: #e2e8f0;
      color: #0f172a;
    }
    button.secondary:hover { background: #cbd5e1; }
    #chat-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      min-height: 280px;
      max-height: 440px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .msg {
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      white-space: pre-wrap;
      line-height: 1.45;
    }
    .user {
      background: #eff6ff;
      border-left: 4px solid #2563eb;
    }
    .assistant {
      background: #f1f5f9;
      border-left: 4px solid #0f766e;
    }
    .meta {
      font-size: 12px;
      color: #475569;
      margin-top: 6px;
    }
    .citations {
      margin-top: 6px;
      font-size: 12px;
      color: #0f766e;
      font-weight: 500;
    }
    #timeline {
      background: #0f172a;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      max-height: 220px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h2>MicroHeal Care Concierge</h2>

  <div class="row">
    <label>Patient:
      <select id="patient-select">
        <option value="pat_003">pat_003 — Priya Nair (Shivalik Greens)</option>
        <option value="pat_010">pat_010 — Suresh Yadav (Lotus Tower)</option>
        <option value="pat_001">pat_001 — Ananya Sharma (Shivalik Greens)</option>
        <option value="pat_016">pat_016 — Sanjay Bhatia (Royal Palms)</option>
      </select>
    </label>
    <label>Thread ID:
      <input id="thread-id" type="text" value="thread_demo_1" />
    </label>
    <button class="secondary" onclick="reloadHistory()">Reload History</button>
    <button class="secondary" onclick="retryLastUuid()">Retry Last UUID</button>
  </div>

  <div id="chat-box"></div>

  <div class="row">
    <input
      id="message-input"
      type="text"
      style="flex: 1;"
      placeholder="Ask about Sunday wellness hours, test fasting, coverage, or book a slot..."
    />
    <button onclick="sendMessage()">Send</button>
  </div>

  <h4>SSE & Tool-Call Timeline</h4>
  <div id="timeline"></div>

  <script>
    let lastRequestId = null;
    let lastPayload = null;

    function createMsgElement(role, metaText = "") {
      const box = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = `msg ${role}`;

      const header = document.createElement("strong");
      header.textContent = role.toUpperCase() + ": ";

      const bodySpan = document.createElement("span");
      bodySpan.className = "msg-body";

      const topLine = document.createElement("div");
      topLine.appendChild(header);
      topLine.appendChild(bodySpan);
      div.appendChild(topLine);

      const citDiv = document.createElement("div");
      citDiv.className = "citations";
      div.appendChild(citDiv);

      const metaDiv = document.createElement("div");
      metaDiv.className = "meta";
      if (metaText) metaDiv.textContent = metaText;
      div.appendChild(metaDiv);

      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return { div, bodySpan, citDiv, metaDiv };
    }

    function appendStaticMsg(role, content, metaText = "", citations = []) {
      const { bodySpan, citDiv, metaDiv } = createMsgElement(role, metaText);
      bodySpan.textContent = content;
      if (Array.isArray(citations) && citations.length > 0) {
        const labels = citations.map(c => c.heading_path || `${c.title} > ${c.section}`);
        citDiv.textContent = "Citations: " + labels.join(" | ");
      }
    }

    function logTimeline(eventName, payload) {
      const tl = document.getElementById("timeline");
      const line = `[${eventName}] ` + (typeof payload === "string" ? payload : JSON.stringify(payload));
      tl.textContent += line + "\n";
      tl.scrollTop = tl.scrollHeight;
    }

    function newUuid() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return "req_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    }

    async function sendMessage(overrideReqId = null, overridePayload = null) {
      const input = document.getElementById("message-input");
      const message = overridePayload ? overridePayload.message : input.value.trim();
      if (!message) return;

      const patient_id = overridePayload ? overridePayload.patient_id : document.getElementById("patient-select").value;
      const thread_id = overridePayload ? overridePayload.thread_id : document.getElementById("thread-id").value.trim();
      const request_id = overrideReqId || newUuid();

      lastRequestId = request_id;
      lastPayload = { patient_id, thread_id, message };

      if (!overridePayload) {
        appendStaticMsg("user", message, `request_id=${request_id}`);
        input.value = "";
      } else {
        appendStaticMsg("user", `${message} (Retry)`, `request_id=${request_id}`);
      }

      const assistantUi = createMsgElement("assistant", `request_id=${request_id}`);
      const collectedCitations = [];

      const response = await fetch("/v1/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ thread_id, patient_id, message, request_id })
      });

      if (!response.ok || !response.body) {
        const errText = await response.text();
        assistantUi.bodySpan.textContent = `Error (${response.status}): ${errText}`;
        logTimeline("error", errText);
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const frames = buffer.split("\n\n");
        buffer = frames.pop() || "";

        for (const frame of frames) {
          if (!frame.trim()) continue;
          let eventName = "message";
          const dataLines = [];
          for (const line of frame.split("\n")) {
            if (line.startsWith("event:")) {
              eventName = line.slice(6).trim();
            } else if (line.startsWith("data:")) {
              dataLines.push(line.slice(5).trim());
            }
          }
          const rawData = dataLines.join("\n");
          let parsed = rawData;
          try {
            parsed = JSON.parse(rawData);
          } catch (_) {}

          logTimeline(eventName, parsed);

          if (eventName === "token" && parsed && typeof parsed.token === "string") {
            assistantUi.bodySpan.textContent += parsed.token;
          } else if (eventName === "citation" && parsed && parsed.citation) {
            collectedCitations.push(parsed.citation);
            const labels = collectedCitations.map(c => c.heading_path || `${c.title} > ${c.section}`);
            assistantUi.citDiv.textContent = "Citations: " + labels.join(" | ");
          } else if (eventName === "final" && parsed) {
            if (parsed.reply) {
              assistantUi.bodySpan.textContent = parsed.reply;
            }
            const parts = [`request_id=${request_id}`];
            if (parsed.booking && (parsed.booking.booking_id || parsed.booking.id)) {
              parts.push(`Booking: ${parsed.booking.booking_id || parsed.booking.id}`);
            }
            if (parsed.escalation_id) {
              parts.push(`Escalation: ${parsed.escalation_id}`);
            }
            assistantUi.metaDiv.textContent = parts.join(" | ");
          } else if (eventName === "error") {
            const errMsg = (parsed && parsed.message) ? parsed.message : String(parsed);
            assistantUi.bodySpan.textContent = `Error: ${errMsg}`;
          }
        }
      }
    }

    async function retryLastUuid() {
      if (!lastRequestId || !lastPayload) {
        logTimeline("info", "No previous request_id to retry.");
        return;
      }
      await sendMessage(lastRequestId, lastPayload);
    }

    async function reloadHistory() {
      const thread_id = document.getElementById("thread-id").value.trim();
      const res = await fetch(`/v1/threads/${encodeURIComponent(thread_id)}`);
      const data = await res.json();
      if (!res.ok) {
        logTimeline("error", `Reload failed: ${JSON.stringify(data)}`);
        return;
      }

      const box = document.getElementById("chat-box");
      box.innerHTML = "";
      document.getElementById("timeline").textContent = "";

      for (const m of (data.messages || [])) {
        appendStaticMsg(
          m.role,
          m.content,
          `thread_id=${thread_id}`,
          m.role === "assistant" ? (data.citations || []) : []
        );
      }

      for (const tc of (data.tool_calls || [])) {
        logTimeline("tool_result", tc);
      }
      logTimeline("final", `Restored thread ${thread_id} (${(data.messages || []).length} messages).`);
    }

    document.getElementById("message-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
