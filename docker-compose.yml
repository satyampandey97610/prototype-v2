services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-microheal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-microheal}
      POSTGRES_DB: ${POSTGRES_DB:-microheal}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microheal -d microheal"]
      interval: 3s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://microheal:microheal@db:5432/microheal
      SYNC_DATABASE_URL: postgresql+psycopg://microheal:microheal@db:5432/microheal
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-12.0}
      DB_TIMEOUT_SECONDS: ${DB_TIMEOUT_SECONDS:-5.0}
      MAX_TOOL_CALLS_PER_TURN: ${MAX_TOOL_CALLS_PER_TURN:-4}
      RETRIEVAL_SIMILARITY_THRESHOLD: ${RETRIEVAL_SIMILARITY_THRESHOLD:-0.22}
    ports:
      - "8000:8000"
    volumes:
      - ./evals:/app/evals

volumes:
  pgdata: